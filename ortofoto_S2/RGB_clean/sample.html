<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ortofoto Seccion 2 - Visor de prueba</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .attr { background: rgba(255,255,255,0.8); padding: 2px 6px; font-size: 11px; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var bounds = [[19.399858036513507, -99.20573952516816], [19.42773434973099, -99.18828604631678]];
  var map = L.map('map', { maxBounds: bounds, maxZoom: 19 });
  L.tileLayer('./tiles/{z}/{x}/{y}.png', {
    minZoom: 15,
    maxZoom: 19,
    maxNativeZoom: 19,
    tms: false,
    attribution: "Ortofoto UAV INyDES 2026 GSD 5cm/px Seccion 2"
  }).addTo(map);
  map.fitBounds(bounds);
</script>
</body>
</html>
