<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Chapultepec Seccion 4 - Salud Vegetal 2026 - Visor de prueba</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .attr { background: rgba(255,255,255,0.8); padding: 2px 6px; font-size: 11px; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var bounds = [[19.386526842337435, -99.23841691327509], [19.39407859671367, -99.22299114751803]];
  var map = L.map('map', { maxBounds: bounds, maxZoom: 19 });
  L.tileLayer('./tiles/{z}/{x}/{y}.png', {
    minZoom: 15,
    maxZoom: 19,
    maxNativeZoom: 19,
    tms: false,
    attribution: "Salud Vegetal UAV - Seccion 4 Chapultepec - INyDES 2026 - GSD 5cm"
  }).addTo(map);
  map.fitBounds(bounds);
</script>
</body>
</html>
